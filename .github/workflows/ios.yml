name: iOS Build & Test

# Runs automatically on every push to your branch, and on pull requests.
# You can also start it by hand from the GitHub "Actions" tab (workflow_dispatch).
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core logic tests (Swift)
    runs-on: macos-15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Run ChessMemoCore unit tests
        working-directory: ChessMemoCore
        run: swift test

  ios-app-build:
    name: Build the iOS app
    runs-on: macos-15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app for the iOS Simulator
        run: |
          xcodebuild \
            -project ChessMemo.xcodeproj \
            -scheme ChessMemo \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
