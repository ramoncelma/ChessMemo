name: iOS Build & Test

# Runs automatically on every push to your branch, and on pull requests.
# You can also start it by hand from the GitHub "Actions" tab (workflow_dispatch).
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core logic tests (Swift)
    runs-on: macos-15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Run ChessMemoCore unit tests
        working-directory: ChessMemoCore
        run: swift test

  ios-app-build:
    name: Build the iOS app
    runs-on: macos-15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app for the iOS Simulator
        run: |
          xcodebuild \
            -project ChessMemo.xcodeproj \
            -scheme ChessMemo \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Package the simulator app so it can be uploaded to Appetize.io
      # (play the app in a browser, no Mac or Apple account needed).
      - name: Zip the simulator app for Appetize.io
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -y "$GITHUB_WORKSPACE/ChessMemo-Simulator.zip" ChessMemo.app

      - name: Upload the playable app
        uses: actions/upload-artifact@v4
        with:
          name: ChessMemo-Simulator
          path: ChessMemo-Simulator.zip
          if-no-files-found: error
