name: TestFlight

# Started by hand from the GitHub "Actions" tab (no automatic runs, so you
# control exactly when a build is sent to TestFlight).
on:
  workflow_dispatch:

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-15
    permissions:
      contents: write   # lets fastlane match store certificates in a branch
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare git access for fastlane match
        run: |
          AUTH=$(printf 'x-access-token:%s' "${{ secrets.GITHUB_TOKEN }}" | base64)
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"

      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
          MATCH_GIT_BRANCH: match-certificates
        run: bundle exec fastlane beta
