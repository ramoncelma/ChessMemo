name: ChessMemo
options:
  bundleIdPrefix: app.chessmemo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ChessMemoCore:
    path: ChessMemoCore
  # TODO(chess-rules): uncomment to integrate full chess move legality
  # ChessKit:
  #   url: https://github.com/chesskit-app/chesskit-swift
  #   from: "0.13.0"

targets:
  ChessMemo:
    type: application
    platform: iOS
    sources:
      - path: ChessMemo
    resources:
      - path: ChessMemo/Resources
        optional: true
    dependencies:
      - package: ChessMemoCore
      # - package: ChessKit
    info:
      path: ChessMemo/Info.plist
      properties:
        CFBundleDisplayName: ChessMemo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Portable Game Notation
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.chess-pgn
              - public.plain-text
            CFBundleTypeRole: Viewer

# Add an iOS unit-test target here once you have iOS-specific code worth
# testing. Core logic is exercised by `swift test` in ChessMemoCore/.
